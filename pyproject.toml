# 앱 1개(✅ 9/30 최신 개발자 문서 기준): 파이썬 패키지 하나(src/ddak). 도구 설정(ruff, pyright, pytest,
# import-linter)은 전부 여기 한 곳에 둔다. 이 파일과 uv.lock은 공유 파일이다(하네스 소유자, CODEOWNERS).
# 의존성 추가는 `uv add <패키지>` 후 하네스 소유자 리뷰.

[project]
name = "ddak"
version = "0.0.0"
description = "딸깍 배포 파이프라인(가칭): 관리 웹 + 계획 + 계획 검증 + 실행기 + 툴 레지스트리, 한 프로세스"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.12,<3",
    "pyyaml>=6,<7",
    "fastapi>=0.141,<1",  # SSE는 fastapi.sse 내장(0.135+). sse-starlette는 쓰지 않는다
    "uvicorn>=0.54,<1",
    "boto3>=1.43,<2",  # cloud/infra·build·deploy·tls·health (C1·C2·C3)
    "jinja2>=3.1,<4",  # C3 관리 페이지. 자동 이스케이프를 항상 사용한다
    "python-hcl2>=7,<8",  # C1 AI Terraform 결과 정적 검사
    "anthropic>=1,<2",
]
# 추가 예정(담당이 `uv add`, 버전은 설치 시 확인):
# - Jev SDK(typesafe-sdk, import 이름 확인 필요): O2
# O1 실행 상태는 우선 표준 sqlite3를 사용한다. 관리 웹 ORM 선택과 분리한다.

[project.scripts]
ddak = "ddak.app:main"

[build-system]
# uv_build의 src/ddak 레이아웃은 로컬 설치로 검증했다.
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.20,<0.13"

[dependency-groups]
dev = [
    "ruff==0.16.9",
    "pyright[nodejs]==1.1.414",
    "import-linter==2.15",
    "pytest>=9.1,<10",
    # pytest 비동기 테스트는 anyio 플러그인만 쓴다. pytest-asyncio는 설치하지 않는다.
    "anyio>=4.15,<5",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "harness"]
# 샘플 앱·패치 케이스와 보존한 설계/조사 자료는 앱 코드 검사에서 제외한다.
extend-exclude = ["harness/apps/sample-app", "harness/fixtures/patch_cases", "docs", "research", "single-app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "T20", "TID", "S"]
# subprocess는 리스트 인자로만 부른다(shell=True 금지는 S602/S604가 계속 잡는다).
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"harness/tests/**" = ["S101", "S105", "S106"]
"conftest.py" = ["S101"]
"harness/scripts/**" = ["T20"]
"src/ddak/core/ai/providers/**" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["ddak", "tests"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"anthropic".msg = "LLM SDK는 ddak.core.ai.providers에서만 import한다"
"openai".msg = "LLM SDK는 ddak.core.ai.providers에서만 import한다"
# 확인 필요: Jev SDK(typesafe-sdk)의 import 이름. 확정되면 이름을 고친다.
"typesafe".msg = "Jev SDK는 ddak.core.ai.providers에서만 import한다"
"langchain".msg = "LangChain은 쓰지 않는다(레지스트리는 pydantic으로 직접 구현)"

# ---------------------------------------------------------------- pyright
# CI 차단은 src/ddak/core만. 나머지는 `make type ALL=1`로 경고만 본다.
[tool.pyright]
include = ["src/ddak/core"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-markers",
    "--import-mode=importlib",
    "-m",
    "not docker and not aws and not llm",
]
testpaths = ["harness/tests"]
# pytest 기본 norecursedirs에서 "build"만 뺀다(tests/unit/cloud/build = 옛 ci 테스트).
norecursedirs = ["*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]
# `from tests.support import ...`와 설치 전 `import ddak`을 위해 루트와 src를 sys.path에 넣는다.
pythonpath = ["harness", "src"]
markers = [
    "docker: 로컬 Docker 데몬이 필요한 테스트 (make test-docker, 담당자 수동)",
    "aws: 실제 AWS 자격증명과 비용이 드는 테스트 (make test-aws, 담당자 수동)",
    "llm: 실제 LLM/Jev API를 호출하는 테스트 (make test-llm, 비용 발생)",
]

# ---------------------------------------------------------------- import-linter
# 계약 타입과 키는 import-linter 2.15 소스로 확인했다. 한 프로세스라서 AI 경계는
# 정적 import 계약 + call_ai 런타임 가드로 강제한다(물리 분리는 컨테이너 모드, 💭).
# forbidden_modules의 외부 패키지(anthropic 등)는 설치 전이면 그래프에 없어서 건너뛴다.
[tool.importlinter]
root_packages = ["ddak"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "1. 실행 경로(빌드·배포·TLS·헬스, 온프렘, 실행기, 운영)와 관리 웹·알림은 AI 관문과 LLM·Jev SDK를 import하지 않는다(간접 포함)"
type = "forbidden"
source_modules = [
    "ddak.cloud.build",
    "ddak.cloud.deploy",
    "ddak.cloud.tls",
    "ddak.cloud.health",
    "ddak.cd",
    "ddak.onprem",
    "ddak.executor",
    "ddak.ops",
    "ddak.web",
    "ddak.integrations",
]
forbidden_modules = ["ddak.core.ai", "anthropic", "openai", "typesafe"]

[[tool.importlinter.contracts]]
name = "2. ddak.core.ai(AI 관문·provider)는 허용된 AI 디렉토리와 조립 진입점만 import한다"
type = "protected"
protected_modules = ["ddak.core.ai"]
# as_packages 기본값(True)이라 디렉토리 이름은 그 패키지와 하위 모듈 전체를 뜻한다.
# 아직 없는 디렉토리는 와일드카드(.**)로 적는다(.**는 하위 모듈만, 패키지 자신은 뺀다).
allowed_importers = [
    "ddak.plan.analyze",  # analyze_project(환경 키 분류, Jev/Claude)
    "ddak.plan.planner",  # generate_plan(step 선택 초안)
    "ddak.plan.patch",  # patch_config·patch_db_access·patch_storage(토글 ON)
    # AI Dockerfile 초안(generate.py). 검사기 validate.py는 계약 5가 AI를 막는다
    "ddak.plan.dockerfile",
    # AI Terraform 초안(✅ 장부 21). 제안만 만들고 apply는 apply_infra(계약 7로 AI 금지)
    "ddak.cloud.infra.tools.generate_infra.**",
    "ddak.verify.diagnose",  # diagnose_parity_gap(원인 설명)
    "ddak.verify.report",  # post_report(보고 요약, 선택)
    # LLM 연결 상태 함수를 관리 웹에 주입하려고만 import한다(호출 없음).
    "ddak.app",
]

[[tool.importlinter.contracts]]
name = "3. 툴 디렉토리(plan, cloud, onprem, cd, verify, ops)끼리는 서로 import하지 않는다(레지스트리 이름으로만 연결)"
type = "independence"
modules = ["ddak.plan", "ddak.cloud", "ddak.onprem", "ddak.cd", "ddak.verify", "ddak.ops"]
# 예외: CD 공통 계약. cd.dispatch는 환경별 provider(cloud.deploy, onprem.deploy의 공개 이름)를
# 고르고, provider·TLS·헬스 구현은 cd.interface(ProviderResult 등)만 읽는다.
ignore_imports = [
    "ddak.cd.dispatch -> ddak.cloud.deploy",
    "ddak.cd.dispatch -> ddak.onprem.deploy",
    "ddak.cloud.** -> ddak.cd.interface",
    "ddak.onprem.** -> ddak.cd.interface",
]

[[tool.importlinter.contracts]]
name = "4. 코어·실행기·관리 웹은 툴 디렉토리를 import하지 않는다(툴 조립은 ddak.app만)"
type = "forbidden"
source_modules = ["ddak.core", "ddak.executor", "ddak.web"]
forbidden_modules = [
    "ddak.plan",
    "ddak.cloud",
    "ddak.onprem",
    "ddak.cd",
    "ddak.verify",
    "ddak.ops",
    "ddak.integrations",
]

[[tool.importlinter.contracts]]
name = "5. 결정적 검사기(validate_plan·validate_dockerfile)는 AI 관문과 생성기를 import하지 않는다"
type = "forbidden"
source_modules = ["ddak.plan.validate", "ddak.plan.dockerfile.validate"]
forbidden_modules = ["ddak.core.ai", "ddak.plan.planner", "ddak.plan.dockerfile.generate"]

[[tool.importlinter.contracts]]
name = "6. 실행기는 관리 웹을 import하지 않는다(웹 -> 실행기 방향만)"
type = "forbidden"
source_modules = ["ddak.executor"]
forbidden_modules = ["ddak.web", "ddak.app"]

[[tool.importlinter.contracts]]
name = "7. 인프라 탐지·검사·plan·apply와 코드 소유 틀은 AI 관문과 generate_infra를 import하지 않는다"
type = "forbidden"
# 계약 5와 같은 이유(생성기와 검사기·실행기 분리). 툴 디렉토리가 생기기 전에도 깨지지 않게
# 와일드카드로 적는다. cloud.infra.providers(코드 소유 틀)는 생성기와 검사기가 같이 읽으므로
# 여기서 AI를 막는다.
source_modules = [
    "ddak.cloud.infra.tools.discover_existing.**",
    "ddak.cloud.infra.tools.validate_infra.**",
    "ddak.cloud.infra.tools.plan_infra.**",
    "ddak.cloud.infra.tools.apply_infra.**",
    "ddak.cloud.infra.providers",
]
forbidden_modules = ["ddak.core.ai", "ddak.cloud.infra.tools.generate_infra"]
