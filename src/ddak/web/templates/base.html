<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Gerbera 배포 관리{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v=ledger-20261003">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <header class="masthead">
    <a class="brand" href="/{% if project %}?project={{ project|urlencode }}{% endif %}">Gerbera</a>
    {% if project %}<span class="project-label">{{ project }}</span>{% endif %}
    <nav aria-label="주 메뉴">
      <a href="/{% if project %}?project={{ project|urlencode }}{% endif %}"{% if request.url.path == '/' %} aria-current="page"{% endif %}>대시보드</a>
      <a href="/ops{% if project %}?project={{ project|urlencode }}{% endif %}"{% if request.url.path == '/ops' %} aria-current="page"{% endif %}>운영</a>
      <a href="/settings{% if project %}?project={{ project|urlencode }}{% endif %}"{% if request.url.path == '/settings' %} aria-current="page"{% endif %}>프로젝트 설정</a>
    </nav>
  </header>
  <div hidden>{% block breadcrumb %}{% endblock %}</div>
  <main id="main">{% block content %}{% endblock %}</main>
  <script src="/static/app.js?v=ledger-20261003" defer></script>
</body>
</html>
