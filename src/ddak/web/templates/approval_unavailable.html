{% extends 'base.html' %}
{% block title %}승인 자료 확인 필요 · Gerbera{% endblock %}
{% block content %}
<section class="page-heading"><div><h1>승인 자료를 불러오지 못했습니다</h1><p>{{ project }} · <code>{{ run_id }}</code></p></div><a class="button secondary" href="/?project={{ project|urlencode }}">대시보드</a></section>
<section class="notice failure"><h2>승인 대기로 남아 있습니다</h2><p>배포는 시작하지 않았습니다. 운영자가 아래 원인과 저장된 준비 자료를 확인해야 합니다.</p><pre>{{ detail|e }}</pre><p>필요한 서비스 연결을 복구한 뒤 승인 자료를 다시 확인하세요.</p><a class="button" href="/runs/{{ run_id }}/approval">다시 확인</a></section>
{% endblock %}
