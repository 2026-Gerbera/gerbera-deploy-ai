{% extends "base.html" %}
{% block title %}프로젝트 만들기 · Gerbera{% endblock %}
{% block content %}
<section class="page-heading" data-project-required><div><h1>프로젝트를 먼저 만드세요</h1><p>저장된 프로젝트 설정이 없습니다. 프로젝트 이름을 정하고 프로젝트 설정에서 소스 저장소를 저장하면 대시보드가 그 프로젝트를 엽니다.</p></div></section>
<section class="section"><form method="get" action="/settings">
  <label><span>프로젝트 이름</span><input name="project" required maxlength="64" pattern="[a-z][a-z0-9_\-]{0,63}" autocomplete="off"><small>영문 소문자로 시작하고 소문자·숫자·-·_만 씁니다.</small></label>
  <button class="button" type="submit">프로젝트 설정으로</button>
</form></section>
{% endblock %}
