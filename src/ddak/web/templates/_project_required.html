{% macro project_required_form() -%}
<form method="get" action="/settings">
  <label><span>프로젝트 이름</span><input name="project" required maxlength="64" pattern="[a-z][a-z0-9_\-]{0,63}" autocomplete="off"><small>영문 소문자로 시작하고 소문자·숫자·-·_만 씁니다.</small></label>
  <button class="button" type="submit">프로젝트 설정으로</button>
</form>
{%- endmacro %}
