 stroke="#5F5E5A" stroke-width="1"/><text x="110.0" y="243.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">코드 수정 토글</text><text x="110.0" y="263.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">OFF면 수정 툴 차단</text><line x1="192" y1="252" x2="206" y2="252" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/><rect x="210" y="224" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="340.0" y="243.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">② 검증 (스크립트)</text><text x="340.0" y="263.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">계획 검증: 허용 툴·필수 단계·토글</text><line x1="472" y1="252" x2="486" y2="252" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/><rect x="490" y="224" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="570.0" y="243.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">불합격 시</text><text x="570.0" y="263.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">재지시 1회 → 규칙 계획</text><line x1="340" y1="280" x2="340" y2="310" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/><rect x="30" y="314" width="620" height="104" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/><text x="48" y="