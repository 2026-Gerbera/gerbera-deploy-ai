anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">검증 (규칙)</text><text x="190.0" y="529.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">헬스·스모크·TLS·교차 비교</text><line x1="332" y1="518" x2="366" y2="518" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/><text x="338" y="506" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#5F5E5A" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">통과</text><rect x="370" y="490" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="500.0" y="509.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">보고 (LLM)</text><text x="500.0" y="529.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">결과 카드·접속 URL·AI 비용</text><line x1="190" y1="546" x2="190" y2="602" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/><text x="200" y="586" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">실패·불일치</text><rect x="50" y="606" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="190.0" y="625.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">규칙 롤백</text><text x="190.0" y="645.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6