thic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">규칙</text><line x1="820" y1="370" x2="1154" y2="370" stroke="#E8E6DE"/><text x="820" y="388" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#2C2C2A" font-family="Menlo, SF Mono, monospace">diagnose_parity_gap</text><text x="820" y="408" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#5F5E5A" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">예: LIKE 대소문자 차이</text><rect x="1075.5" y="379" width="78.5" height="18" rx="9" fill="#EEEDFE" stroke="#534AB7"/><text x="1114.75" y="388" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#3C3489" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">Jev+LLM</text><rect x="816" y="486" width="342" height="80" rx="8" fill="#F1EFE8"/><text x="828" y="504" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#2C2C2A" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">데모: &quot;apple&quot; 검색이 클라우드만 0건 →</text><text x="828" y="524" text-anchor="start" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#2C2C2A" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">AI 수정 → 재배포 후 양쪽 일치</text><text x="828" y="548" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">위험: 킥오프 예시라 겹칠 가능성 큼</text><text x="30" y="608" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A" font-family="Apple SD Gothic Neo, AppleSDGothicNeo, Noto Sans KR, sans-serif">판단 배지: 규칙 = 결정적 규칙 / Jev = 정해진 보기 중 선택 / LLM = 문장·코드 생성.  결정 게이트(제안): 10/1 정오, AI 패치 성공률 10개 중 8개 이상이면 A(또는 통합), 아니면 B</text></svg>