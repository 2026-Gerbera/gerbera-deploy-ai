<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="92" viewBox="0 0 1104 92" role="img" aria-labelledby="title desc">
  <title id="title">Gerbera Deploy AI technology stack</title>
  <desc id="desc">Python 3.13, FastAPI, Terraform, AWS ECS Fargate, and Docker Hub</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
  </defs>

  <g transform="scale(.8)" filter="url(#shadow)" font-family="Inter, Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">
    <g transform="translate(8 18)">
      <rect width="158" height="56" rx="14" fill="#3776ab"/>
      <circle cx="29" cy="28" r="19" fill="#fff"/>
      <image href="logos/python.svg" x="17" y="16" width="24" height="24"/>
      <text x="57" y="33" fill="#fff">Python 3.13</text>
    </g>

    <g transform="translate(180 18)">
      <rect width="142" height="56" rx="14" fill="#05998b"/>
      <circle cx="29" cy="28" r="19" fill="#fff"/>
      <image href="logos/fastapi.svg" x="17" y="16" width="24" height="24"/>
      <text x="57" y="33" fill="#fff">FastAPI</text>
    </g>

    <g transform="translate(336 18)">
      <rect width="156" height="56" rx="14" fill="#7b42bc"/>
      <circle cx="29" cy="28" r="19" fill="#fff"/>
      <image href="logos/terraform.svg" x="17" y="16" width="24" height="24"/>
      <text x="57" y="33" fill="#fff">Terraform</text>
    </g>

    <g transform="translate(506 18)">
      <rect width="218" height="56" rx="14" fill="#253247"/>
      <circle cx="29" cy="28" r="19" fill="#fff"/>
      <image href="logos/aws-fargate.svg" x="9" y="8" width="40" height="40"/>
      <text x="57" y="33" fill="#fff">ECS Fargate</text>
    </g>

    <g transform="translate(738 18)">
      <rect width="174" height="56" rx="14" fill="#1d63ed"/>
      <circle cx="29" cy="28" r="19" fill="#fff"/>
      <image href="logos/docker.svg" x="17" y="16" width="24" height="24"/>
      <text x="57" y="33" fill="#fff">Docker Hub</text>
    </g>
