      <g class="solid"><g transform="translate(0 -6)"><g class="tail"><path class="tl" d="M24 52 C10 52 4 44 4 34 C4 24 10 18 14 16"/></g></g>
<g transform="translate(38 54)"><g class="up h p2"><path d="M-5 -7 C-6.5 2 -2 8 -0.6 14.5 L4.4 14.5 C4.6 8 4.4 1 3.4 -7 Z"/><g class="lo h p2"><path d="M-1 13 L-1.6 25.5 C-2 27.2 -0.8 28 1.2 28 L4.4 28 C5.6 28 5.4 26.4 4 25.8 L4.2 13 Z"/></g></g></g>
<g transform="translate(79 54)"><g class="up f p3"><path d="M-2.8 -2 L-2.4 14.5 L3.2 14.5 L3.4 -2 Z"/><g class="lo f p3"><path d="M-2.4 13 L-2.1 25 C-2.5 26.8 -1.4 28 0.8 28 L4.2 28 C5.4 28 5.2 26.4 3.7 25.6 L3.2 13 Z"/></g></g></g>
<g transform="translate(0 -6)"><path d="M23 52 C33 45 51 45 63 46 C69 46 73 44 76 41 C78 39 81 38 84 39 C88 41 88 45 87 50 C86 55 84 59 81 62 C78 64 74 64 70 63 C62 61 52 60 44 62 C36 64 28 63 24 59 C21 57 21 54 23 52 Z"/></g>
<g transform="translate(32 54)"><g class="up h p0"><path d="M-5 -7 C-6.5 2 -2 8 -0.6 14.5 L4.4 14.5 C4.6 8 4.4 1 3.4 -7 Z"/><g class="lo h p0"><path d="M-1 13 L-1.6 25.5 C-2 27.2 -0.8 28 1.2 28 L4.4 28 C5.6 28 5.4 26.4 4 25.8 L4.2 13 Z"/></g></g></g>
<g transform="translate(74 54)"><g class="up f p1"><path d="M-2.8 -2 L-2.4 14.5 L3.2 14.5 L3.4 -2 Z"/><g class="lo f p1"><path d="M-2.4 13 L-2.1 25 C-2.5 26.8 -1.4 28 0.8 28 L4.2 28 C5.4 28 5.2 26.4 3.7 25.6 L3.2 13 Z"/></g></g></g>
<g transform="translate(-2 -1)"><path d="M81 33 C80 29 81 27 83 25 L84 17.5 L88.5 23 C90 22.7 91.3 22.7 92.6 23 L95.8 16.5 L96.2 24.6 C97.8 26.2 98.6 28 99 29.5 L102 32 C101.6 33.6 100.2 34.6 98.2 35 C96.8 36.6 94.6 37.6 91.6 37.6 C87.6 37.6 83 36.2 81 33 Z"/></g></g>
