# 로컬(온프렘) 배포 대상의 DB tier 템플릿(컨테이너 모드). 담당: 김준석(O2, 온프렘 인프라 프로비저닝)
# 기준: 앱 1개 구조(🟡 팀 합의 대기, docs/18). DB는 두 환경 모두 MySQL(✅ 장부 12).
#
# - web·was는 여기서 올리지 않는다. 실행기가 deploy_tier(onprem provider)로 Docker Hub의 같은 digest를
#   읽기 전용 토큰으로 받아 tier별로 올린다(✅ 장부 9·10, 9/30 Docker Hub 기본). 이 파일은 db 서버와 네트워크만 사전 구축한다.
# - 설계 원형은 tier별 서버(VM)다. 자원이 부족하면 이 컨테이너 모드로 간다(✅ 장부 10).
# - 초기화 스크립트에는 DB·사용자 생성만. 스키마는 클라우드와 같은 마이그레이션 경로로 만든다.
# - 비밀번호는 compose/local/.secrets/ 파일(gitignore)로 넣는다. 이 파일에 값을 적지 않는다.
#     mkdir -p .secrets && python3 -c "import secrets;print(secrets.token_urlsafe(24))" > .secrets/mysql_root_password
#     python3 -c "import secrets;print(secrets.token_urlsafe(24))" > .secrets/mysql_app_password
# - 로컬 HTTPS는 ⏸ 보류. 온프렘 앱 기본 주소는 http://localhost:8080(web tier가 연다).
# 확인 필요: 이미지 digest 고정값(mysql:8.4.11). 데모 전에 `make preflight`로 미리 받아 둔다.
name: flaskr-local

services:
  db:
    image: mysql:8.4.11  # 💭 digest로 고정(mysql:8.4.11@sha256:...)
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: flaskr
      MYSQL_USER: flaskr_app
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    secrets:
      - mysql_root_password
      - mysql_app_password
    volumes:
      - flaskr_db:/var/lib/mysql
    networks:
      flaskr_back:
        ipv4_address: 172.30.0.20
    # TCP로 확인한다. 소켓 ping은 초기화 중(약 11초)에도 성공한다. ping은 접근 거부여도 exit 0이라
    # 명령줄에 비밀번호를 넣지 않는다.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    # 3306은 공개하지 않는다(was에서만 접근). 디버깅이 필요하면 127.0.0.1에만 잠깐 연다.
    # ports:
    #   - "127.0.0.1:3306:3306"

networks:
  # web·was 컨테이너는 실행기가 이 네트워크에 붙인다. was는 고정 IP 172.30.0.10
  # (nginx는 upstream 이름을 시작 때 한 번만 해석하므로 WAS를 다시 만들어도 주소가 같아야 한다).
  flaskr_back:
    name: flaskr_back
    ipam:
      config:
        - subnet: 172.30.0.0/24
  flaskr_front:
    name: flaskr_front

volumes:
  flaskr_db:

secrets:
  mysql_root_password:
    file: ./.secrets/mysql_root_password
  mysql_app_password:
    file: ./.secrets/mysql_app_password
