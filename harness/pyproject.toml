# 앱 1개(✅ 9/30 최신 개발자 문서 기준): 파이썬 패키지 하나(src/ddak). 도구 설정(ruff, pyright, pytest,
# import-linter)은 전부 여기 한 곳에 둔다. 이 파일과 uv.lock은 공유 파일이다(하네스 소유자, CODEOWNERS).
# 의존성 추가는 `uv add <패키지>` 후 하네스 소유자 리뷰.

[project]
name = "ddak"
version = "0.0.0"
description = "딸깍 배포 파이프라인(가칭): 관리 웹 + 계획 + 계획 검증 + 실행기 + 툴 레지스트리, 한 프로세스"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.12,<3",
    "pyyaml>=6,<7",
    "fastapi>=0.141,<1",  # SSE는 fastapi.sse 내장(0.135+). sse-starlette는 쓰지 않는다
    "uvicorn>=0.54,<1",
    "boto3>=1.43,<2",  # infra·ci·cd(providers/aws)·verify cloud 쪽(C1·C2·C3)
]
# 추가 예정(담당이 `uv add`, 버전은 설치 시 확인):
# - anthropic: call_ai api backend(O2). 1.x는 httpx2 기반
# - Jev SDK(typesafe-sdk, import 이름 확인 필요): O2
# - jinja2: 관리 웹 템플릿(C3)
# O1 실행 상태는 우선 표준 sqlite3를 사용한다. 관리 웹 ORM 선택과 분리한다.

[project.scripts]
ddak = "ddak.app:main"

[build-system]
# uv_build의 src/ddak 레이아웃은 로컬 설치로 검증했다.
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.20,<0.13"

[dependency-groups]
dev = [
    "ruff==0.16.9",
    "pyright[nodejs]==1.1.414",
    "import-linter==2.15",
    "pytest>=9.1,<10",
    # pytest 비동기 테스트는 anyio 플러그인만 쓴다. pytest-asyncio는 설치하지 않는다.
    "anyio>=4.15,<5",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "."]
# 샘플 앱·패치 케이스와 보존한 설계/조사 자료는 앱 코드 검사에서 제외한다.
extend-exclude = ["apps/sample-app", "fixtures/patch_cases"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "T20", "TID", "S"]
# subprocess는 리스트 인자로만 부른다(shell=True 금지는 S602/S604가 계속 잡는다).
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"conftest.py" = ["S101"]
"scripts/**" = ["T20"]
"src/ddak/core/ai/providers/**" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["ddak", "tests"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"anthropic".msg = "LLM SDK는 ddak.core.ai.providers에서만 import한다"
"openai".msg = "LLM SDK는 ddak.core.ai.providers에서만 import한다"
# 확인 필요: Jev SDK(typesafe-sdk)의 import 이름. 확정되면 이름을 고친다.
"typesafe".msg = "Jev SDK는 ddak.core.ai.providers에서만 import한다"
"langchain".msg = "LangChain은 쓰지 않는다(레지스트리는 pydantic으로 직접 구현)"

# ---------------------------------------------------------------- pyright
# CI 차단은 src/ddak/core만. 나머지는 `make type ALL=1`로 경고만 본다.
[tool.pyright]
include = ["src/ddak/core"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-markers",
    "--import-mode=importlib",
    "-m",
    "not docker and not aws and not llm",
]
testpaths = ["tests"]
# `from tests.support import ...`와 설치 전 `import ddak`을 위해 루트와 src를 sys.path에 넣는다.
pythonpath = [".", "src"]
markers = [
    "docker: 로컬 Docker 데몬이 필요한 테스트 (make test-docker, 담당자 수동)",
    "aws: 실제 AWS 자격증명과 비용이 드는 테스트 (make test-aws, 담당자 수동)",
    "llm: 실제 LLM/Jev API를 호출하는 테스트 (make test-llm, 비용 발생)",
]

# ---------------------------------------------------------------- import-linter
# 계약 타입과 키는 import-linter 2.15 소스로 확인했다. 한 프로세스라서 AI 경계는
# 정적 import 계약 + call_ai 런타임 가드로 강제한다(물리 분리는 컨테이너 모드, 💭).
# forbidden_modules의 외부 패키지(anthropic 등)는 설치 전이면 그래프에 없어서 건너뛴다.
[tool.importlinter]
root_packages = ["ddak"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "1. 실행 경로(빌드·배포, 실행기, 운영)와 관리 웹은 AI 관문과 LLM·Jev SDK를 import하지 않는다(간접 포함)"
type = "forbidden"
source_modules = ["ddak.ci", "ddak.cd", "ddak.executor", "ddak.ops", "ddak.web"]
forbidden_modules = ["ddak.core.ai", "anthropic", "openai", "typesafe"]

[[tool.importlinter.contracts]]
name = "2. ddak.core.ai(AI 관문·provider)는 허용된 AI 툴 9개와 조립 진입점만 import한다"
type = "protected"
protected_modules = ["ddak.core.ai"]
# 툴 디렉토리가 생기기 전에도 깨지지 않게 와일드카드(.**)로 적는다. .**는 하위 모듈(tool.py,
# logic.py 등)만 가리키고 패키지 자신(__init__.py)은 뺀다. 그래서 __init__.py에는 로직을 두지 않는다.
allowed_importers = [
    "ddak.plan.tools.analyze_project.**",
    "ddak.plan.tools.generate_plan.**",
    # AI Dockerfile 초안(✅ 9/30, Dockerfile이 없을 때만). 검사는 validate_dockerfile(계약 5)
    "ddak.plan.tools.generate_dockerfile.**",
    "ddak.plan.tools.patch_db_access.**",
    "ddak.plan.tools.patch_storage.**",
    "ddak.plan.tools.patch_config.**",
    # AI Terraform 초안(✅ 장부 21). 제안만 만들고 apply는 infra.tools.apply_infra(계약 7로 AI 금지)
    "ddak.infra.tools.generate_infra.**",
    "ddak.verify.tools.diagnose_parity_gap.**",
    "ddak.verify.tools.post_report.**",
    # LLM 연결 상태 함수를 관리 웹에 주입하려고만 import한다(호출 없음).
    "ddak.app",
]

[[tool.importlinter.contracts]]
name = "3. 툴 모듈끼리는 서로 import하지 않는다(레지스트리 이름으로만 연결)"
type = "independence"
modules = ["ddak.plan", "ddak.infra", "ddak.ci", "ddak.cd", "ddak.verify", "ddak.ops"]

[[tool.importlinter.contracts]]
name = "4. 코어·실행기·관리 웹은 툴 모듈을 import하지 않는다(툴 조립은 ddak.app만)"
type = "forbidden"
source_modules = ["ddak.core", "ddak.executor", "ddak.web"]
forbidden_modules = ["ddak.plan", "ddak.infra", "ddak.ci", "ddak.cd", "ddak.verify", "ddak.ops"]

[[tool.importlinter.contracts]]
name = "5. 결정적 검사기(validate_plan·validate_dockerfile)는 AI 관문과 생성기를 import하지 않는다"
type = "forbidden"
# forbidden의 source_modules는 그래프에 있어야 한다. 툴 디렉토리가 생기기 전에도
# 깨지지 않도록 하위 모듈 와일드카드(**)로 적는다. 디렉토리가 생기면 자동으로 검사된다.
source_modules = [
    "ddak.plan.tools.validate_plan.**",
    "ddak.plan.tools.validate_dockerfile.**",
]
forbidden_modules = [
    "ddak.core.ai",
    "ddak.plan.tools.generate_plan",
    "ddak.plan.tools.generate_dockerfile",
]

[[tool.importlinter.contracts]]
name = "6. 실행기는 관리 웹을 import하지 않는다(웹 -> 실행기 방향만)"
type = "forbidden"
source_modules = ["ddak.executor"]
forbidden_modules = ["ddak.web", "ddak.app"]

[[tool.importlinter.contracts]]
name = "7. 인프라 탐지·검사·plan·apply와 코드 소유 틀은 AI 관문과 generate_infra를 import하지 않는다"
type = "forbidden"
# 계약 5와 같은 이유(생성기와 검사기·실행기 분리). 디렉토리가 생기기 전에도 깨지지 않게 와일드카드로
# 적는다. infra.providers(코드 소유 틀)는 생성기와 검사기가 같이 읽으므로 여기서 AI를 막는다.
source_modules = [
    "ddak.infra.tools.discover_existing.**",
    "ddak.infra.tools.validate_infra.**",
    "ddak.infra.tools.plan_infra.**",
    "ddak.infra.tools.apply_infra.**",
    "ddak.infra.providers",
]
forbidden_modules = ["ddak.core.ai", "ddak.infra.tools.generate_infra"]
