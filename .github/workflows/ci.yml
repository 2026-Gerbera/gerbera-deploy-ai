# CI 자동 검사 3개. 3일 해커톤 기준: 필수 PR 승인·브랜치 보호는 요구하지 않는다.
# 규칙(tests/contract/test_ci_guard.py가 검사):
# - 모든 uses:는 40자리 커밋 SHA로 고정하고 버전을 주석으로 적는다.
# - 권한은 읽기 전용만. 실패 무시 설정, pytest 범위 축소 플래그 금지(목록은 test_ci_guard.py).
# - run: 안에 ${{ }}를 직접 쓰지 않는다(스크립트 인젝션). 값은 env:로만 넘긴다.
# - AWS 자격증명을 넣지 않는다(배포는 실행기가 데모 머신에서 한다).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    defaults:
      run:
        working-directory: harness
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true
          python-version-file: harness/.python-version
          cache-dependency-glob: uv.lock
      - name: sync (lock 그대로)
        run: uv sync --locked
      - name: lint, type, boundary, contracts, test
        run: uv run python scripts/dev.py ci

  attribution:
    name: attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: commits (author, committer, message, co-author)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 harness/scripts/git_guard.py range "$BASE" "$HEAD"
      - name: PR title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 harness/scripts/git_guard.py pr-text

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install gitleaks (sha256 검증)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # 출처: 릴리스 v8.30.1의 gitleaks_8.30.1_checksums.txt (2026-09-30 확인)
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: scan commit range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ -z "${BASE//0/}" ]; then
            log_opts="$HEAD"
          else
            log_opts="$BASE..$HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$log_opts" .
